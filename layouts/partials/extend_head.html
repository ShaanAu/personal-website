<!-- Drifting particle background (Sami-style ambient motion) -->
<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  function start() {
    var canvas = document.createElement('canvas');
    canvas.id = 'bg-particles';
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');

    var w, h, dpr, particles = [];
    var glowSprite = null, glowKey = '';

    // pre-render a soft radial glow once per colour (cheap to blit, unlike shadowBlur)
    function buildGlow(color) {
      var size = 64, oc = document.createElement('canvas');
      oc.width = oc.height = size;
      var g = oc.getContext('2d');
      var grd = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      grd.addColorStop(0,   'rgba(' + color + ',0.55)');
      grd.addColorStop(0.4, 'rgba(' + color + ',0.20)');
      grd.addColorStop(1,   'rgba(' + color + ',0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      glowSprite = oc; glowKey = color;
    }

    function theme() {
      var s = getComputedStyle(document.documentElement);
      return {
        rgb: (s.getPropertyValue('--particle-rgb').trim() || '139, 92, 246'),
        glow: parseFloat(s.getPropertyValue('--particle-glow')) > 0
      };
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var target = Math.round(Math.min(48, (w * h) / 32000)); // scale to viewport
      particles = [];
      for (var i = 0; i < target; i++) particles.push(spawn(true));
    }

    function spawn(anywhere) {
      return {
        x: Math.random() * w,
        y: anywhere ? Math.random() * h : h + 10,
        len: 5 + Math.random() * 7,            // petal length
        vy: 0.16 + Math.random() * 0.44,       // slow upward drift
        vx: (Math.random() - 0.5) * 0.24,      // gentle sway
        a: 0.1 + Math.random() * 0.26,         // opacity
        sway: Math.random() * Math.PI * 2,
        ss: 0.0055 + Math.random() * 0.01,
        rot: Math.random() * Math.PI * 2,      // current rotation
        vr: (Math.random() - 0.5) * 0.02       // tumble speed
      };
    }

    // draw a 4-petal blossom centred at 0,0
    function petal(ctx, len, color, a) {
      var wd = len * 0.55;
      for (var k = 0; k < 4; k++) {
        ctx.save();
        ctx.rotate(k * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(wd, -len * 0.5, 0, -len);
        ctx.quadraticCurveTo(-wd, -len * 0.5, 0, 0);
        ctx.fillStyle = 'rgba(' + color + ',' + a + ')';
        ctx.fill();
        ctx.restore();
      }
    }

    function frame() {
      ctx.clearRect(0, 0, w, h);
      var th = theme(), color = th.rgb;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.sway += p.ss;
        p.rot += p.vr;
        p.y -= p.vy;
        p.x += p.vx + Math.sin(p.sway) * 0.25;
        if (p.y < -15) { particles[i] = spawn(false); continue; }
        ctx.save();
        ctx.translate(p.x, p.y);
        if (th.glow) {                       // soft luminous halo on dark (cached sprite)
          if (glowKey !== color) buildGlow(color);
          var gs = p.len * 4;
          ctx.globalAlpha = Math.min(1, p.a + 0.15);
          ctx.drawImage(glowSprite, -gs / 2, -gs / 2, gs, gs);
          ctx.globalAlpha = 1;
        }
        ctx.rotate(p.rot);
        // squash on one axis as it tumbles, for a fluttering feel
        ctx.scale(1, 0.6 + 0.4 * Math.abs(Math.sin(p.sway * 1.3)));
        petal(ctx, p.len, color, th.glow ? Math.min(1, p.a + 0.25) : p.a);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }

    var t;
    window.addEventListener('resize', function () {
      clearTimeout(t); t = setTimeout(resize, 200);
    });
    resize();
    requestAnimationFrame(frame);
  }

  if (document.body) start();
  else document.addEventListener('DOMContentLoaded', start);
})();
</script>
