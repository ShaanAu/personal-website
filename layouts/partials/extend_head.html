<!-- Drifting particle background (cherry blossom style) -->
<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (window.innerWidth < 768) return;

  function start() {
    var canvas = document.createElement('canvas');
    canvas.id = 'bg-particles';
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');

    var w, h, dpr, particles = [];
    var glowSprite = null, glowKey = '';
    var cachedTheme = null;
    var wind = 0, windTarget = 0, windTimer = 0;

    function buildGlow(color) {
      var size = 80, oc = document.createElement('canvas');
      oc.width = oc.height = size;
      var g = oc.getContext('2d');
      var grd = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      grd.addColorStop(0,   'rgba(' + color + ',0.45)');
      grd.addColorStop(0.35,'rgba(' + color + ',0.15)');
      grd.addColorStop(1,   'rgba(' + color + ',0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      glowSprite = oc; glowKey = color;
    }

    function readTheme() {
      var s = getComputedStyle(document.documentElement);
      cachedTheme = {
        rgb:  s.getPropertyValue('--particle-rgb').trim() || '139, 92, 246',
        glow: parseFloat(s.getPropertyValue('--particle-glow')) > 0
      };
    }


    // 0 = far (small/slow/faint), 1 = mid, 2 = near (large/fast/solid)
    var layerDefs = [
      { lenMin: 3,  lenMax: 6,  vyMin: 0.08, vyMax: 0.18, aMin: 0.06, aMax: 0.16, swayAmp: 0.12 },
      { lenMin: 6,  lenMax: 10, vyMin: 0.15, vyMax: 0.28, aMin: 0.12, aMax: 0.28, swayAmp: 0.20 },
      { lenMin: 10, lenMax: 16, vyMin: 0.25, vyMax: 0.45, aMin: 0.18, aMax: 0.42, swayAmp: 0.30 },
      { lenMin: 22, lenMax: 40, vyMin: 0.06, vyMax: 0.12, aMin: 0.08, aMax: 0.18, swayAmp: 0.40 }
    ];

    function spawnLayer(layer, anywhere) {
      var c = layerDefs[layer];
      return {
        layer:    layer,
        x:        Math.random() * (w + 100) - 50,
        y:        anywhere ? Math.random() * h : -20,
        len:      layer === 3 ? c.lenMin + Math.random() * (c.lenMax - c.lenMin) : 5 + Math.pow(Math.random(), 1.5) * 11,
        vy:       c.vyMin  + Math.random() * (c.vyMax  - c.vyMin),
        vx:       (Math.random() - 0.5) * 0.12,
        a:        c.aMin   + Math.random() * (c.aMax   - c.aMin),
        swayAmp:  c.swayAmp,
        sway:     Math.random() * Math.PI * 2,
        ss:       0.008 + Math.random() * 0.012,
        rot:      Math.random() * Math.PI * 2,
        vr:       (Math.random() - 0.5) * 0.014,
        nPetals:  [4, 5, 5, 5][Math.floor(Math.random() * 4)],
        asymm:    0.82 + Math.random() * 0.36,
        bright:   0.82 + Math.random() * 0.36
      };
    }

    // Single petal — cubic bezier with a heart notch at the tip (cherry blossom shape)
    function drawPetal(len, wd) {
      var n = len * 0.09;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo( wd * 0.85,  len * 0.15,  wd * 0.50,  len * 0.66,  wd * 0.12, len * 0.94);
      ctx.quadraticCurveTo( wd * 0.04, len,  0, len - n);
      ctx.quadraticCurveTo(-wd * 0.04, len, -wd * 0.12, len * 0.94);
      ctx.bezierCurveTo(-wd * 0.50,  len * 0.66, -wd * 0.85,  len * 0.15,  0, 0);
      ctx.closePath();
    }

    function drawBlossom(p, color, alpha) {
      var len  = p.len;
      var wd   = len * p.asymm * 0.48;
      var step = (Math.PI * 2) / p.nPetals;
      for (var k = 0; k < p.nPetals; k++) {
        ctx.save();
        ctx.rotate(k * step + (k % 2 === 0 ? 0.04 : -0.04));
        var ps = 0.90 + (k % 2) * 0.20;
        ctx.scale(ps, ps);
        drawPetal(len, wd);
        ctx.fillStyle = 'rgba(' + color + ',' + (alpha * (0.85 + k * 0.03)).toFixed(3) + ')';
        ctx.fill();
        ctx.restore();
      }
      // centre pip
      ctx.beginPath();
      ctx.arc(0, 0, len * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + color + ',' + Math.min(1, alpha * 1.5).toFixed(3) + ')';
      ctx.fill();
    }

    function frame() {
      ctx.clearRect(0, 0, w, h);
      var th = cachedTheme, color = th.rgb;

      // smooth wind gusts
      if (--windTimer <= 0) {
        windTarget = (Math.random() - 0.5) * 0.22;
        windTimer  = 200 + Math.floor(Math.random() * 400);
      }
      wind += (windTarget - wind) * 0.004;

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.sway += p.ss;
        p.rot  += p.vr;
        p.y    += p.vy;
        p.x    += p.vx + Math.sin(p.sway) * p.swayAmp + Math.sin(p.sway * 2.3) * p.swayAmp * 0.3 + wind * (0.4 + p.layer * 0.4);

        if (p.y > h + 20 || p.x < -40 || p.x > w + 40) { particles[i] = spawnLayer(p.layer, false); continue; }

        // fade in over first 60px from top, fade out over last 80px at bottom
        var alpha = p.a * Math.min(1, p.y / 60) * Math.min(1, (h - p.y) / 80);
        if (alpha < 0.005) continue;

        ctx.save();
        ctx.translate(p.x, p.y);
        if (th.glow) {
          if (glowKey !== color) buildGlow(color);
          var gs = p.len * 5;
          ctx.globalAlpha = Math.min(1, alpha * 1.6);
          ctx.drawImage(glowSprite, -gs / 2, -gs / 2, gs, gs);
          ctx.globalAlpha = 1;
        }
        ctx.rotate(p.rot);
        // flutter: squash horizontally as it tumbles (natural for a falling petal)
        ctx.scale(0.55 + 0.45 * Math.abs(Math.sin(p.sway * 1.3)), 1);
        drawBlossom(p, color, alpha * p.bright);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width  = w * dpr; canvas.height = h * dpr;
      canvas.style.width  = w + 'px'; canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var base = Math.min(1.2, (w * h) / (1440 * 900));
      var counts = [
        Math.round(22 * base + 8),
        Math.round(16 * base + 5),
        Math.round(10 * base + 3),
        3
      ];
      particles = [];
      for (var layer = 0; layer < 4; layer++) {
        for (var j = 0; j < counts[layer]; j++) {
          particles.push(spawnLayer(layer, true));
        }
      }
    }

    readTheme();
    new MutationObserver(function () { readTheme(); }).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme', 'class']
    });

    var t;
    window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(resize, 200); });
    resize();
    requestAnimationFrame(frame);
  }

  if (document.body) start();
  else document.addEventListener('DOMContentLoaded', start);
})();
</script>

<!-- Scroll reveal -->
<script>
(function () {
  function initReveal() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('reveal-visible'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry, idx) {
        if (entry.isIntersecting) {
          (function (el, delay) {
            setTimeout(function () { el.classList.add('reveal-visible'); }, delay);
          })(entry.target, idx * 90);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initReveal);
  else initReveal();
})();
</script>
